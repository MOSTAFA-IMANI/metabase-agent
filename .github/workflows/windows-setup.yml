# Builds SoupopSetup.exe on a Windows machine. Every build is kept as a download on the
# workflow run. Publishing a GitHub Release (or pushing a tag like setup-v1.0.0) also
# attaches the .exe to that release, which is the link the start page and README use.
name: Windows setup app

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-setup.yml"]
    tags: ["setup-v*"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-setup.yml"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet publish windows/SoupopSetup -c Release -o out

      - name: Smoke test (checks only, changes nothing)
        shell: pwsh
        run: |
          & .\out\SoupopSetup.exe --check --folder "$env:GITHUB_WORKSPACE"
          # 0 = all green, 1 = something to fix (expected here: no Codex, no sign-in). Anything else is a crash.
          if ($LASTEXITCODE -gt 1 -or $LASTEXITCODE -lt 0) { exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: SoupopSetup
          path: out/SoupopSetup.exe

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/setup-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoupopSetup

      - uses: softprops/action-gh-release@v2
        with:
          files: SoupopSetup.exe
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body: |
            Soupop Data Setup for Windows. Download SoupopSetup.exe and double-click it.
            Windows may say it protected your PC: click More info, then Run anyway.
